# Plain PHP: scripts reading the request through superglobals. There is no
# entry-point convention (a script is its own entry), so no parameter is
# bound from the request; data reaches a helper only through a call.
name: php-plain
languages: [php]

file_evidence:
  - label: reads a request superglobal
    pattern: '\$_(GET|POST|REQUEST|COOKIE|FILES)\b'
  - label: reads php://input
    pattern: 'php://input'

sources:
  - '\$_(GET|POST|REQUEST|COOKIE|FILES|SESSION|ENV)\b'
  # $_SERVER: only request-derived keys (or a computed key); SERVER_PROTOCOL, REQUEST_METHOD,
  # REMOTE_ADDR and friends are set by the server. Same set as the PHP taint patterns.
  - '\$_SERVER\s*\[\s*[''"](HTTP_\w*|REQUEST_URI|QUERY_STRING|PATH_INFO|ORIG_PATH_INFO|PATH_TRANSLATED|PHP_SELF|PHP_AUTH_\w+|AUTH_TYPE|argv)[''"]'
  - '\$_SERVER\s*\[\s*[$\w(]'
  - '\bgetallheaders\('

params:
  mode: none
