id: ZS-CS-006
lifecycle: released
name: Hardcoded Credential
version: "1.0.0"
language: csharp
category: authentication
severity: high
confidence: medium
cwe:
  - CWE-798
owasp:
  - "A07:2025"
rationale: |
  A credential embedded as a string literal in source ships inside the
  compiled assembly, and .NET binaries decompile back to near-original,
  readable source with tools like ILSpy or dotPeek, so an attacker who
  obtains only the shipped DLL/EXE — with no repository or CI access at all
  — can recover the literal along with the surrounding logic that uses it.
  Once extracted, the attacker gains standing access to whatever the
  credential protects (a database, an internal API, a third-party service)
  that persists until the secret is rotated, independent of any other
  vulnerability in the running application.
description: |
  A variable named like a credential (password, secret, api key, token) is
  assigned a string literal directly in source code, rather than loaded from
  configuration, an environment variable, or a secrets manager.
message: "Hardcoded credential detected — load secrets from configuration or a secrets manager"
references:
  - https://cwe.mitre.org/data/definitions/798.html
tags: [hardcoded-credential, authentication]
match:
  kind: assignment
  lhs_identifier: "(?i)(password|secret|api[_-]?key|apikey|token)"
  rhs_literal: "^@?[\"].+[\"]$"
  filters:
    # A guarded sentinel is not a leaked credential: it is a known-bad value
    # that exists so a start-up check can recognise it and refuse to boot.
    # The report that motivated this flagged INSECURE_JWT_SECRET as a HIGH
    # hardcoded credential -- deleting that literal would have removed the
    # production safety check, inverting the actual security posture.
    #
    # Matched by naming convention rather than by proving the guard exists:
    # confirming the comparison would need cross-function analysis, and a
    # value shouting INSECURE_ at the reader is already a deliberate signal.
    - not:
        kind: assignment
        lhs_identifier: "(?i)^[$@]?(INSECURE|PLACEHOLDER|CHANGEME|CHANGE_ME|DEV_ONLY|EXAMPLE|DUMMY|FAKE|SAMPLE|DEFAULT)_"
    # The name only contains a credential word; the variable holds a name,
    # route, scheme or message about it, not the credential. const string
    # PasswordFieldName = "Password", TokenEndpoint = "/connect/token",
    # ApiKeyHeader = "X-Api-Key", PasswordLabel = "Password". Keyed on the
    # name's last word, so ApiKey, SecretKey and Password itself still match.
    - not:
        kind: assignment
        lhs_identifier: '(?i)(Name|Type|Claim|Header|Label|Url|Uri|Endpoint|Path|Scheme|Message|Title|Placeholder|Prefix|Cookie|Field)$'
    # A value that is a sentence, a route or a format slot is text shown to a
    # person or sent to a router, not a secret: "Invalid password", "/login",
    # "Password for {0}". Generated secrets and real passwords seldom contain
    # whitespace, and the secrets scanner applies the same rule.
    - not:
        kind: assignment
        rhs_literal: '^@?"(?:[^"]*\s[^"]*|/[^"]*|[^"]*\{[0-9]+\}[^"]*)"$'
fix_suggestion: "Replace the literal with Environment.GetEnvironmentVariable, IConfiguration, or a secrets manager lookup."
