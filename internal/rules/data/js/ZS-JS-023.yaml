id: ZS-JS-023
lifecycle: released
name: Weak Pseudo-Random Number Generator (Math.random)
version: "1.0.0"
language: javascript
category: cryptography
severity: medium
confidence: medium
cwe:
  - CWE-338
owasp:
  - "A04:2025"
rationale: |
  Math.random() is not cryptographically secure: its output is generated by
  a fast, non-cryptographic algorithm with a small internal state that can
  be predicted or reconstructed by an attacker who observes a handful of
  outputs. Using it to generate session tokens, password-reset codes, API
  keys, or any other value that must be unguessable lets that attacker
  predict or brute-force future values far more easily than a true random
  space would allow. This is exploitable anywhere the generated value is
  meant to be unpredictable, unlike its legitimate uses (UI jitter,
  non-security sampling, test fixtures) where predictability doesn't
  matter.
description: |
  Detects Math.random() whose result is bound to a security-relevant name:
  assigned to (or interpolated into a value assigned to) a variable or
  property named like a token, secret, password, nonce, salt, OTP/PIN,
  key, session or CSRF value, a reset/verification/invite code or an id
  such as a UUID; or returned from a function so named. Math.random() used
  for a captcha operand, a shuffle, an animation delay, seed data or a
  display identifier is not flagged.
message: "Math.random() used for a security-sensitive value — not cryptographically secure, predictable to an attacker"
references:
  - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
tags: [weak-crypto, weak-prng, math-random]
match:
  kind: call
  callee: Math.random
  filters:
    # Fire only when the value is bound to a security-relevant name: the
    # variable or property it is assigned to, or the function whose return
    # value it is. Names are compared in snake_case word form, so
    # sessionToken -> session_token matches token, but tokenizer does not.
    - context_identifier_matches: "(^|_)(token|secret|password|passwd|pwd|nonce|salt|otp|pin|key|keys|session|sid|csrf|xsrf|reset|verify|verification|code|auth|credential|credentials|api_key|apikey|iv|seed|uuid|guid|invite|challenge)(_|$)"
fix_suggestion: "Use crypto.randomBytes() or crypto.getRandomValues() for tokens, session IDs, and password-reset codes; Math.random() is fine only for non-security randomness."
