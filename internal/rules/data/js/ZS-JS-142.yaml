id: ZS-JS-142
lifecycle: released
name: Hardcoded Cryptographic Key in Environment Fallback
version: "1.0.0"
language: javascript
category: authentication
severity: high
confidence: medium
cwe:
  - CWE-321
owasp:
  - "A04:2025"
rationale: |
  process.env.X || 'literal' looks configurable, but the literal is the
  value in every environment where the variable is unset -- local, CI,
  preview deployments, and any production host where someone forgot to set
  it. The application then runs on a secret anyone with the source knows,
  silently, because nothing fails at start-up.
  When the value feeds a cipher, an HMAC or a JWT signer it is key material:
  whoever knows it can forge tokens and signatures or decrypt data.
description: |
  An assignment of process.env.X || / ?? '<literal>', where X names a
  secret, key, token or password, and the assigned variable is passed (in
  the same function, or the same file for a top-level constant) to a crypto
  or JWT API: createHash/createHmac/createCipheriv, scrypt/pbkdf2/hkdf,
  jwt sign/verify. Reported as CWE-321; the same fallback that does not feed
  a crypto API is reported by the CWE-798 sibling rule instead, never both.
message: "Hardcoded fallback encryption/signing key - fail at start-up when the environment variable is unset instead of falling back to a literal"
references:
  - https://cwe.mitre.org/data/definitions/321.html
tags: [hardcoded-key, cryptography, env-fallback]
match:
  kind: assignment
  rhs_literal: "(?i)^process\\.env\\.[A-Za-z0-9_]*(SECRET|PASSWORD|PASSWD|_PWD|TOKEN|KEY|PASSPHRASE)[A-Za-z0-9_]*\\s*(\\|\\||\\?\\?)\\s*[\"'`][^\"'`\\s$]{4,}[\"'`]$"
  filters:
      - lhs_flows_to_call: "(^|\\.)(createHash|createHmac|createCipheriv|createDecipheriv|createCipher|createDecipher|createSecretKey|scrypt|scryptSync|pbkdf2|pbkdf2Sync|hkdf|hkdfSync|sign|verify|SignJWT|jwtVerify|importKey|AES\\.encrypt|AES\\.decrypt|HmacSHA256|HmacSHA512)$"
      - not:
          kind: assignment
          rhs_literal: "(?i)^process\\.env\\.([A-Za-z0-9_]*(PUBLIC|PUBLISHABLE)|[A-Za-z0-9_]*(_URL|_URI|_HOST|_PATH|_PREFIX|_NAME|_ID|_REGION|_FILE|_DIR|_ALG|_ALGORITHM|_EXPIRY|_EXPIRES_IN|_TTL|_ISSUER|_AUDIENCE|_HEADER)\\b)|(\\|\\||\\?\\?)\\s*[\"'`](https?://|wss?://|/|\\./|\\.\\./)"
      - not:
          kind: assignment
          rhs_literal: "(?i)(changeme|change_me|change-me|xxx|example|placeholder|dummy|sample|your[_-]|redacted|replace[_-]?me|<[^>]*>|\\$\\{|\\{\\{|%s|^[bru]?[\"'`]\\*+[\"'`]$)"
      - not:
          kind: assignment
          rhs_literal: "(?i)^[bru]?[\"'`](null|none|nil|undefined|true|false|empty|bearer|basic|string|text|hidden|required|password|passwd|secret|token)[\"'`]$"
fix_suggestion: "Remove the fallback literal and throw at start-up if the variable is missing; generate the key with a CSPRNG and store it in a secrets manager."
