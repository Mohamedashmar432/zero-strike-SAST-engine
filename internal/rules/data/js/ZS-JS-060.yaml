id: ZS-JS-060
lifecycle: released
name: NoSQL Injection via MongoDB findOne()
version: "1.0.0"
language: javascript
category: injection
severity: high
confidence: medium
cwe:
  - CWE-943
owasp:
  - "A05:2025"
rationale: |
  A tainted filter passed to findOne() lets an attacker inject MongoDB
  operators — $ne/$gt to turn an equality check into an authentication
  bypass, $regex to enumerate values character by character, or $where to
  run JavaScript server-side — so a lookup meant for one document returns
  or authenticates the wrong one. This is exploitable wherever request
  data is embedded in the filter without constraining values to plain
  scalars.
description: |
  Detects calls to collection.findOne() (the conventional MongoDB driver
  receiver name, matching ZS-JS-039's convention for collection.find)
  where an argument traces back to an untrusted source (intra-procedural
  taint tracking).

  The receiver may be any expression whose name ends in collection or model (case-insensitive), including db.collection('name'). Filters that use $where are reported by the $where rule instead.
message: "collection.findOne() called with a tainted filter — validate/coerce input before building the query"
references:
  - https://owasp.org/www-community/attacks/NoSQL_injection
tags: [nosql-injection, injection, mongodb]
match:
  kind: call
  filters:
    # Any receiver named like a MongoDB collection or model:
    # collection.findOne, db.reviewsCollection.findOne, db.collection('x').findOne,
    # UserModel.findOne. The exact `collection.findOne` callee only matched a
    # variable that happened to be called collection.
    - callee_pattern: '(?i)(collection|model)(\(\))?\.findOne$'
    # Sequelize/TypeORM-style query objects ({ where: ... }) are parameterized, not Mongo filters.
    - not:
        kind: call
        filters:
          - kwarg:
              name: where
              value_pattern: ""
    # A $where filter is owned by the dedicated $where rule (one finding
    # per call).
    - not:
        kind: call
        filters:
          - kwarg:
              name_pattern: '^["'']?\$where["'']?$'
              value_pattern: ""
    - tainted_argument: true
fix_suggestion: "Pass user values as plain scalar filter values, validate their types, and never interpolate input into $where."
