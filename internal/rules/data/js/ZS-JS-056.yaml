id: ZS-JS-056
lifecycle: released
name: setTimeout() with Tainted String (Code Injection)
version: "1.0.0"
language: javascript
category: dangerous-functions
severity: high
confidence: medium
cwe:
  - CWE-95
owasp:
  - "A05:2025"
rationale: |
  setTimeout() with a string first argument eval()s that string when the
  timer fires — the same code-execution sink as eval() with a delay.
  Attacker-controlled data reaching it executes arbitrary JavaScript in
  the page (DOM context) or process (Node context), with full access to
  cookies, storage, and the application itself.
description: |
  Detects calls to setTimeout() where an argument traces back to an
  untrusted source (intra-procedural taint tracking). Calls whose first
  argument is a function reference are the safe form and, being neither
  tainted variables nor source expressions, do not fire this rule.
message: "setTimeout() called with a tainted argument — string arguments are eval'd; pass a function instead"
references:
  - https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout#security_considerations
tags: [code-injection, eval-like, dom]
match:
  kind: call
  callee: setTimeout
  filters:
    - tainted_argument: true
      # Only argument 0 is executed as code; a tainted *delay* is not
      # code injection. Unindexed, this fired on setTimeout(cb, delay).
      tainted_argument_index: 0
      # Parameter-only taint is not enough here: this sink takes an ordinary
      # argument in ordinary code, so seeded parameter taint alone flagged
      # every helper that had one. See taint.Result.Weak.
      require_real_source: true
    # Argument 0 being a function is the fix this rule recommends, so
    # never report it. Negative form is deliberate: the corpus fixture
    # passes a bare identifier holding a string (setTimeout(code, 100)),
    # which a positive [literal] allowlist would wrongly exclude.
    - argument_kind_not_at:
        index: 0
        kinds: [function_def]
fix_suggestion: "Always pass a function to setTimeout(); never a string built from user input."
