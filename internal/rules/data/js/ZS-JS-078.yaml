id: ZS-JS-078
lifecycle: released
name: vm.runInContext() with Tainted Code
version: "1.0.0"
language: javascript
category: dangerous-functions
severity: high
confidence: medium
cwe:
  - CWE-95
owasp:
  - "A05:2025"
rationale: |
  vm.runInContext() compiles and executes its string argument inside a
  vm context, so attacker-controlled data reaching it is code execution
  inside the Node process. The vm module is not a security boundary —
  documented sandbox escapes via this.constructor chains reach the host
  Function constructor — so even a "sandboxed" context lets the injected
  code break out to file system and network access.
description: |
  Detects calls to vm.runInContext() where the code argument traces back
  to an untrusted source (intra-procedural taint tracking). Sibling of
  ZS-JS-043 (vm.runInNewContext) and ZS-JS-077 (vm.runInThisContext).
message: "vm.runInContext() called with tainted code — vm is not a security sandbox"
references:
  - https://owasp.org/www-community/attacks/Code_Injection
tags: [code-injection, vm, eval-like]
match:
  kind: call
  callee: vm.runInContext
  filters:
    - tainted_argument: true
fix_suggestion: "Never pass user input to vm execution; use a fixed script set or a real sandbox (isolated-vm) for untrusted code."
