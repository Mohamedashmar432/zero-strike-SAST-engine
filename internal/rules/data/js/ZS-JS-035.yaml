id: ZS-JS-035
lifecycle: retired
# Retired 2026-11-09 on production false-positive evidence (portal Scan Engine tags):
# axios.get SSRF: 96 of 133 findings (72%) tagged false positive across 4 production projects.
# Reversible: set lifecycle back to released. A retired rule's findings stop appearing; no detection
# is replaced, so a genuine instance of this pattern is no longer reported.
name: Server-Side Request Forgery (axios.get)
version: "1.0.0"
language: javascript
category: ssrf
severity: high
confidence: medium
cwe:
  - CWE-918
owasp:
  - "A01:2025"
rationale: |
  When the URL passed to axios.get() is derived from request input, the
  attacker chooses where the server sends its outbound request: internal-only
  services (localhost admin panels, cloud metadata endpoints such as
  169.254.169.254), other hosts inside the network perimeter, or arbitrary
  external systems. The server's network position and its credentials are
  turned against it, enabling internal port scanning, credential theft from
  metadata services, and pivoting into systems the attacker cannot reach
  directly.
description: |
  Detects calls to axios.get() where an argument traces back to an
  untrusted source (intra-procedural taint tracking). Matches the
  conventional module binding name "axios"; a differently-named import
  binding will not match.
message: "axios.get() called with a tainted URL — validate the target against an allowlist to prevent SSRF"
references:
  - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
  - https://cwe.mitre.org/data/definitions/918.html
tags: [ssrf, axios, http-client]
match:
  kind: call
  callee: axios.get
  filters:
    - tainted_argument: true
      # axios.get(url, config): only argument 0 decides where the request
      # goes. Argument 1 is the request config (params, headers, timeout);
      # a tainted query param or header sent to a fixed, trusted endpoint is
      # not SSRF.
      tainted_argument_index: 0
      # A request helper that takes the URL as a plain parameter
      # (get(url) { return axios.get(url) }) is not a source on its own; a
      # real source (req.query.url, a destructured body field) still fires.
      require_real_source: true
    # The destination is decided by scheme://host, so a URL that opens with a
    # fixed host, a same-origin path, or a configuration value
    # (process.env.X, this.baseUrl, a module constant) and only varies an id
    # or query tail is a request to a fixed service, not SSRF. A tainted
    # first operand, or a bare tainted variable, still fires.
    - argument_host_fixed: 0
fix_suggestion: "Validate the target URL against an allowlist of hosts and schemes before passing it to axios.get(); never fetch a raw user-supplied URL."
