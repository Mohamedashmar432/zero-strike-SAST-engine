id: ZS-JS-080
lifecycle: released
name: Server-Side Template Injection (handlebars.compile)
version: "1.0.0"
language: javascript
category: ssti
severity: high
confidence: medium
cwe:
  - CWE-1336
owasp:
  - "A03:2025"
rationale: |
  Handlebars templates are marketed as logic-less, but a tainted template
  string still executes attacker JavaScript through helper invocation and
  prototype-chain lookups (patched repeatedly, e.g. the __lookupGetter__
  and constructor escapes), and at minimum lets the attacker read every
  property reachable from the render context — including configuration
  and secrets. A "custom email/page template" feature fed from request
  data is the classic exploit path.
description: |
  Detects calls to handlebars.compile() where the template argument
  traces back to an untrusted source (intra-procedural taint tracking).
message: "handlebars.compile() called with a tainted template — server-side template injection risk"
references:
  - https://owasp.org/www-community/attacks/Server_Side_Template_Injection
tags: [ssti, injection, handlebars]
match:
  kind: call
  callee: handlebars.compile
  filters:
    - tainted_argument: true
fix_suggestion: "Keep template source static; pass user data only as the render context, never as template text."
