id: ZS-JS-066
lifecycle: released
name: Deprecated crypto.createCipher() (No Random IV)
version: "1.0.0"
language: javascript
category: cryptography
severity: medium
confidence: high
cwe:
  - CWE-327
owasp:
  - "A04:2025"
rationale: |
  crypto.createCipher() is deprecated because it derives the key and IV
  from a password with the broken EVP_BytesToKey KDF (single-round MD5, no
  salt) and therefore produces no random per-message IV: identical
  plaintexts encrypt to identical ciphertexts under the same password,
  and the derived keys have far less entropy than the password appears to
  provide. Both properties let an attacker recognize or replay encrypted
  content and brute-force the password offline.
description: |
  Detects any call to crypto.createCipher() — the API is deprecated and
  insecure regardless of the algorithm chosen. The secure replacement is
  crypto.createCipheriv() with a strong algorithm and a random IV.
message: "crypto.createCipher() is deprecated and insecure (weak KDF, no random IV) — use crypto.createCipheriv()"
references:
  - https://nodejs.org/api/crypto.html#cryptocreatecipheralgorithm-password-options
tags: [cryptography, weak-crypto, deprecated-api]
match:
  kind: call
  callee: crypto.createCipher
fix_suggestion: "Switch to crypto.createCipheriv() with aes-256-gcm (or chacha20-poly1305) and a random per-message IV."
