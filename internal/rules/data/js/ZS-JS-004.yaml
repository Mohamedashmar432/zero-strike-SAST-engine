id: ZS-JS-004
lifecycle: retired
# Retired 2026-11-07 on measured precision: across 19 RealVuln repos this rule produced 0 true positive(s) and 4 false positive(s)
# (precision under 35 percent, no critical-severity or proven-injection exemption applies).
# Reversible: set lifecycle back to released. Findings of this shape are no longer reported.
name: Function() Constructor (Dynamic Code Execution)
version: "1.0.0"
language: javascript
category: injection
severity: high
confidence: high
cwe:
  # CWE-94 (Improper Control of Generation of Code) is the parent of
  # CWE-95 (eval injection) and covers Function()/vm.* as well; CodeQL's
  # js/code-injection uses it.
  - CWE-94
owasp:
  - "A05:2025"
rationale: |
  The Function() constructor compiles a string into a new function and
  executes it with global scope — unlike eval(), it cannot see the caller's
  local variables, but that offers no real protection since the resulting
  function still runs with the full privileges of the page or Node.js
  process once invoked, giving the attacker arbitrary code execution. This
  is exploitable wherever templating engines, plugin systems, or dynamic
  handler generation build a Function() body from user-supplied strings,
  such as configuration values, form input, or query-derived expressions.
description: |
  Detects calls to the Function() constructor where the string argument
  traces back to an untrusted source (intra-procedural taint tracking).
message: "new Function() detected with a tainted argument — dynamic code construction is equivalent to eval()"
references:
  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/Function
tags: [eval, dynamic-code, injection]
match:
  kind: call
  callee: Function
  filters:
    - tainted_argument: true
fix_suggestion: "Replace new Function(str) with a static function or JSON.parse() for data; never pass user input."
