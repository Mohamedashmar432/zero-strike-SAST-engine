id: ZS-JS-007
lifecycle: released
name: Hardcoded Credential
version: "1.0.0"
language: javascript
category: authentication
severity: high
confidence: medium
cwe:
  - CWE-798
owasp:
  - "A07:2025"
rationale: |
  A credential embedded as a string literal in source code ships wherever
  the code ships — an attacker can read it straight out of a client-side
  JavaScript bundle via browser devtools, or extract it from server-side
  code through source control history, build artifacts, or a compromised
  CI pipeline. Once extracted, the attacker gains standing access to
  whatever the credential protects (a database, an internal API, a
  third-party service) that persists until the secret is rotated,
  independent of any other vulnerability in the running application.
description: |
  A variable named like a credential (password, secret, apiKey, token) is
  assigned a string literal directly in source code, rather than loaded from
  an environment variable or secrets manager.
message: "Hardcoded credential detected — load secrets from environment variables or a secrets manager"
references:
  - https://cwe.mitre.org/data/definitions/798.html
tags: [hardcoded-credential, authentication]
match:
  kind: assignment
  # The credential word must end the name or be followed by a word boundary
  # (_, digit, capital): secretKey, API_TOKEN, jwtSecret -- but not tokenizer.
  lhs_identifier: "(?i:password|passwd|secret|api_?key|token)(?:$|[_A-Z0-9])"
  rhs_literal: "^[\"'`].+[\"'`]$"
  filters:
    # Names that end in a descriptor hold metadata about a credential, not the
    # credential: BeeTokenAddress, tokenUrl, passwordField, secretName.
    - not:
        kind: assignment
        lhs_identifier: "(?i)(address|addr|url|uri|endpoint|path|name|label|field|header|type|count|length|len|prefix|suffix|format|regex|pattern|placeholder|id|key_?name)$"
    # A template literal with ${...} is assembled at runtime (e.g. from
    # randomBytes), not hardcoded.
    - not:
        kind: assignment
        rhs_literal: "^`.*\\$\\{"
    # A public EVM address (0x + 40 hex) is not a secret.
    - not:
        kind: assignment
        rhs_literal: "^[\"'`]0x[0-9a-fA-F]{40}[\"'`]$"
    # The whole value is a server-side template placeholder filled per
    # request ("{{ csrf_token }}", "<%= token %>"), not a literal secret.
    - not:
        kind: assignment
        rhs_literal: "^[\"'`]\\s*(\\{\\{.*\\}\\}|\\{%.*%\\}|<%.*%>)\\s*[\"'`]$"
    # CSRF/XSRF tokens are per-session anti-forgery values, not credentials.
    - not:
        kind: assignment
        lhs_identifier: "(?i)(csrf|xsrf)"
    # A guarded sentinel is not a leaked credential: it is a known-bad value
    # that exists so a start-up check can recognise it and refuse to boot.
    # The report that motivated this flagged INSECURE_JWT_SECRET as a HIGH
    # hardcoded credential -- deleting that literal would have removed the
    # production safety check, inverting the actual security posture.
    #
    # Matched by naming convention rather than by proving the guard exists:
    # confirming the comparison would need cross-function analysis, and a
    # value shouting INSECURE_ at the reader is already a deliberate signal.
    - not:
        kind: assignment
        lhs_identifier: "(?i)^[$@]?(INSECURE|PLACEHOLDER|CHANGEME|CHANGE_ME|DEV_ONLY|EXAMPLE|DUMMY|FAKE|SAMPLE|DEFAULT)_"
fix_suggestion: "Replace the literal with process.env.YOUR_VAR or a secrets manager lookup."
