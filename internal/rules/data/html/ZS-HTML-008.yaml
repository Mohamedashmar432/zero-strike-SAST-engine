id: ZS-HTML-008
lifecycle: released
name: Password Field Without Safe autocomplete
version: "1.0.0"
language: html
category: sensitive-data
severity: info
confidence: medium
# Hardening tier. Browsers ignore autocomplete=off on password fields and
# NIST SP 800-63B encourages password managers, so this is a browser-storage
# policy note, not a credential-protection weakness. Left out of default
# output; reported with --include-hardening.
tier: hardening
cwe:
  - CWE-522
owasp:
  - "A07:2025"
rationale: |
  A password <input> that does not declare a controlled autocomplete value
  (off, new-password, or current-password) lets the browser and any installed
  form-fillers cache the secret with default heuristics — persisting credentials
  in shared-machine profiles and browser stores where they can later be
  recovered. Declaring the intended autocomplete behavior is the documented way
  to keep control of how a credential field is remembered.
description: |
  Flags <input type="password"> elements that explicitly opt in to generic
  autocomplete (autocomplete="on"). A password field with no autocomplete
  attribute is not flagged: that is the browser default every password manager
  is built around, and flagging it reported every login form on the web.
message: "Password <input> with autocomplete=\"on\" — prefer new-password/current-password so the browser handles the credential as a password"
references:
  - https://cwe.mitre.org/data/definitions/522.html
  - https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/autocomplete
tags: [sensitive-data, credentials, autocomplete, html]
match:
  kind: call
  callee: input
  filters:
    - kwarg:
        name: type
        value_pattern: "(?i)^password$"
    - kwarg:
        name: autocomplete
        value_pattern: '(?i)^\s*on\s*$'
fix_suggestion: "Set autocomplete=\"new-password\" on sign-up/change forms and autocomplete=\"current-password\" on login forms (or \"off\" to opt out)."
