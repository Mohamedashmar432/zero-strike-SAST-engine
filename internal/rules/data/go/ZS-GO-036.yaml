id: ZS-GO-036
lifecycle: released
name: SSRF via http.NewRequest()
version: "1.0.0"
language: go
category: ssrf
severity: high
confidence: medium
cwe:
  - CWE-918
owasp:
  - "A01:2025"
rationale: |
  http.NewRequest() builds a request to whatever URL it is given, and a
  URL derived from request data lets an attacker make the server connect
  anywhere they choose - internal services behind the firewall, cloud
  metadata endpoints (169.254.169.254 yields instance credentials), or
  third-party hosts via an attacker's redirect chain. This is the
  request-builder half of SSRF: the convenience wrappers (http.Get/Post,
  ZS-GO-012/027) hide it, but custom-method or header-carrying calls all
  flow through NewRequest.
description: |
  Detects calls to http.NewRequest() where an argument traces back to an
  untrusted source (intra-procedural taint tracking).
message: "http.NewRequest() called with a tainted URL - validate scheme and host against an allowlist"
references:
  - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
tags: [ssrf, net-http]
match:
  kind: call
  callee: http.NewRequest
  filters:
    - tainted_argument: true
      # http.NewRequest(method, url, body): the URL is argument 1, NOT 0.
      # Argument 0 is the HTTP method and argument 2 is the request body;
      # a tainted body posted to a fixed endpoint is not SSRF, and a tainted
      # method is a different (much weaker) problem than request forgery.
      tainted_argument_index: 1
fix_suggestion: "Validate the URL's scheme and host against an allowlist before building the request; never pass raw user input as the URL."
