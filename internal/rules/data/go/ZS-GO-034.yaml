id: ZS-GO-034
lifecycle: released
name: Path Traversal via os.OpenFile()
version: "1.0.0"
language: go
category: path-traversal
severity: high
confidence: medium
cwe:
  - CWE-22
owasp:
  - "A01:2025"
rationale: |
  os.OpenFile() opens a path for reading or writing depending on flags;
  when the path traces back to untrusted input, an attacker can escape
  the intended directory with ../ sequences or an absolute path and read
  or - with O_CREATE/O_WRONLY flags - overwrite arbitrary files the
  process can access, turning a path bug into data theft or code
  execution via overwritten configs and scripts.
description: |
  Detects calls to os.OpenFile() where an argument traces back to an
  untrusted source (intra-procedural taint tracking). Sibling of
  ZS-GO-003 (os.Open), which covers the read-only convenience wrapper.
message: "os.OpenFile() called with a tainted path - validate and confine the path before opening"
references:
  - https://owasp.org/www-community/attacks/Path_Traversal
tags: [path-traversal, file-access, os]
match:
  kind: call
  callee: os.OpenFile
  filters:
    - tainted_argument: true
fix_suggestion: "Resolve the path and confirm it stays within the allowed base directory before opening; reject absolute paths and '..' segments."
