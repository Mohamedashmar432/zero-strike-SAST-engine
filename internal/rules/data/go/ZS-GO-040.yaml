id: ZS-GO-040
lifecycle: released
name: template.HTML() Cast of Tainted Value (XSS)
version: "1.0.0"
language: go
category: xss
severity: high
confidence: medium
cwe:
  - CWE-79
owasp:
  - "A05:2025"
rationale: |
  Casting a string to template.HTML tells html/template to embed the
  value verbatim, bypassing the engine's contextual auto-escaping - so
  attacker-controlled data in the cast is written into the page as raw
  markup: script tags, event handlers, and forged UI execute in the
  victim's session under the site's origin, enabling cookie theft and
  account takeover. The Go docs themselves warn the cast "encapsulates
  known safe content" and must never be applied to untrusted data.
description: |
  Detects calls to template.HTML() (the html/template conversion) where
  an argument traces back to an untrusted source (intra-procedural
  taint tracking).
message: "template.HTML() cast of a tainted value - bypasses auto-escaping (XSS)"
references:
  - https://pkg.go.dev/html/template#HTML
tags: [xss, template, escaping]
match:
  kind: call
  callee: template.HTML
  filters:
    # Deliberately unindexed. template.HTML(x) is a type conversion, so it has
    # exactly one operand and that operand is the markup. Pinning index 0
    # would be a no-op against the identical subtree.
    - tainted_argument: true
fix_suggestion: "Let html/template escape user content; if HTML is required, sanitize it first (e.g. bluemonday) before casting."
