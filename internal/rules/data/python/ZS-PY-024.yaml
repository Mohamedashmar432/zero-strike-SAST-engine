id: ZS-PY-024
lifecycle: released
name: Empty except Handler Swallows Exception
version: "1.0.0"
language: python
category: error-handling
severity: medium
confidence: high
cwe:
  - CWE-390
owasp:
  # A09 Logging & Monitoring Failures, not A10 SSRF. The old A10 mapping is
  # what rendered "Server-Side Request Forgery - FAIL, 3 findings" on a report
  # whose three findings were all swallowed exceptions and none was SSRF.
  - "A09:2025"
rationale: |
  Silently discarding an exception with a bare pass hides the fact that an
  operation failed — including security-relevant failures such as a rejected
  authentication attempt, a failed signature check, or a permission error —
  so the surrounding code proceeds as if the operation had succeeded ("fail
  open"). This is particularly dangerous when the guarded operation is a
  security control, since there is no log entry or alert to reveal that the
  check was bypassed.
description: |
  A catch-all except handler (bare except:, Exception or BaseException) whose
  body is just "pass" silently swallows every failure with no logging or
  recovery. Fires once per try block containing at least one such handler.
  Not flagged: a handler for a narrow exception type (except
  FileNotFoundError: pass around os.remove, except KeyError: pass) -- that is
  ordinary EAFP control flow about one specific, expected failure -- and an
  empty handler carrying a comment, which documents a deliberate choice.
message: "except clause with an empty (pass-only) body detected — log or handle the exception"
references:
  - https://cwe.mitre.org/data/definitions/390.html
tags: [exception-handling, empty-handler, fail-open]
match:
  kind: try
  filters:
    - except_handler:
        empty: true
        broad: true
        commented: false
fix_suggestion: "At minimum log the exception (logging.exception(...)) instead of silently passing."
