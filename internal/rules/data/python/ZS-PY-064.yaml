id: ZS-PY-064
lifecycle: released
name: Arbitrary File Deletion via os.remove()
version: "1.0.0"
language: python
category: path-traversal
severity: high
confidence: medium
cwe:
  - CWE-73
owasp:
  - "A01:2025"
rationale: |
  Passing attacker-controlled input to os.remove() lets the attacker
  delete any file the process's OS-level permissions allow — application
  code, configuration, other users' uploads, or data needed for
  integrity/availability — using ../ sequences or absolute paths to escape
  whatever directory the developer intended. This is exploitable wherever
  a filename from a request (a cleanup endpoint, an expired-download
  handler) reaches os.remove() without being resolved and confined to a
  known base directory.
description: |
  Detects calls to os.remove() where the path argument traces back to an
  untrusted source (intra-procedural taint tracking).
message: "os.remove() called with a tainted path — confine deletions to an allowlisted base directory"
references:
  - https://owasp.org/www-community/attacks/Path_Traversal
tags: [path-traversal, file-deletion]
match:
  kind: call
  callee: os.remove
  filters:
    - tainted_argument: true
fix_suggestion: "Resolve the path and verify it stays within the intended directory (os.path.realpath + startswith check) before deleting."
