id: ZS-PY-022
lifecycle: released
name: Sensitive Value Logged
version: "1.0.0"
language: python
category: logging
severity: medium
confidence: low
cwe:
  - CWE-532
owasp:
  - "A09:2025"
rationale: |
  Passwords, API keys, and tokens written to application logs persist in log
  files, log-aggregation platforms, and monitoring dashboards that are often
  readable by a much broader audience (ops staff, third-party log SaaS,
  anyone with log-storage access) than the credential's intended scope. Once
  logged, the secret is effectively exposed for as long as log retention and
  backups keep it around, which is typically far longer than an application's
  primary datastore.
description: |
  A variable whose name suggests sensitive data (password, secret, api_key,
  token) is passed to a logging call: debug/info/warning/warn/error/
  exception/critical on any receiver, so the logging module, a
  module-level logger, self.logger and custom log objects alike. Names
  interpolated into an f-string argument count, since the f-string's
  replacement fields are part of the argument. print() is not covered.
message: "Sensitive-looking value passed to a logging call; avoid logging credentials"
references:
  - https://cwe.mitre.org/data/definitions/532.html
tags: [logging, information-disclosure]
match:
  kind: call
  filters:
    - callee_matches: "\\.(debug|info|warning|warn|error|exception|critical)$"
    # Value-side only: keyword names (secret_name=...), metadata identifiers
    # (config.api_key_secret_name) and arguments already passed through a
    # sanitizer are not a logged secret. Evaluated per identifier, so a real
    # secret logged next to a metadata field still fires.
    - logged_identifier:
        pattern: "(?i)(password|secret|api_key|token)"
        exclude_suffix: "(?i)_(name|id|type|scheme|url|path|count|len|prefix)$"
        sanitizer_callee: "(?i)(sanitiz|redact|mask|scrub|hash)"
fix_suggestion: "Redact or omit sensitive values before logging; log an identifier instead of the secret itself."
