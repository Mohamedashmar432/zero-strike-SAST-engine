id: ZS-PY-074
lifecycle: released
name: SSRF via requests.delete()
version: "1.0.0"
language: python
category: ssrf
severity: high
confidence: medium
cwe:
  - CWE-918
owasp:
  - "A01:2025"
rationale: |
  Passing an attacker-controlled URL to requests.delete() makes the server
  issue an HTTP DELETE to a destination the attacker chose, exposing
  internal services to remote resource deletion — cloud metadata
  endpoints, internal admin APIs, and infrastructure services that trust
  the server's network position. This is exploitable wherever a remote
  resource URL is taken from request data without scheme/host
  allowlisting.
description: |
  Detects calls to requests.delete() where an argument traces back to an
  untrusted source (intra-procedural taint tracking). Sibling of
  ZS-PY-025/026/073 (requests.get/post/put).
message: "requests.delete() called with a tainted URL — validate scheme and host against an allowlist"
references:
  - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
tags: [ssrf, requests]
match:
  kind: call
  callee: requests.delete
  filters:
    - tainted_argument: true
      # requests.delete(url, **kwargs): only argument 0 decides where the
      # request goes. Tainted headers/params/timeout kwargs cannot redirect
      # it.
      tainted_argument_index: 0
fix_suggestion: "Validate the URL's scheme and host against an allowlist before issuing the request; never pass raw user input as the URL."
