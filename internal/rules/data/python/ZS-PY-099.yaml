id: ZS-PY-099
lifecycle: retired
# Retired 2026-11-07 on measured precision: across 19 RealVuln repos this rule produced 5 true positive(s) and 17 false positive(s)
# (precision under 35 percent, no critical-severity or proven-injection exemption applies).
# Reversible: set lifecycle back to released. Findings of this shape are no longer reported.
name: Cookie Set Without Secure Flag
version: "1.0.0"
language: python
category: security-misconfiguration
severity: low
confidence: medium
cwe:
  - CWE-614
owasp:
  - "A02:2025"
rationale: |
  Django's and Flask/Werkzeug's set_cookie default to secure=False, so the
  browser also sends the cookie over plain HTTP. One request to an http://
  URL of the site (a downgraded link, an open Wi-Fi network) exposes it to
  anyone on the path.
description: |
  Flags response.set_cookie(...) (any receiver) without secure set to a
  true value. A non-literal secure= value (e.g. settings.SESSION_COOKIE_SECURE)
  is treated as set. Cookie-clearing calls are skipped as in ZS-PY-098.
  One finding per call: this rule is the primary report for a cookie that
  lacks Secure, and its message covers HttpOnly as well. ZS-PY-098 fires only
  for a call that already sets Secure and still lacks HttpOnly, so no call is
  reported twice.
message: "Cookie set without the Secure flag (sent over plain HTTP); also pass httponly=True and a samesite value"
references:
  - https://owasp.org/www-community/controls/SecureCookieAttribute
tags: [cookie, misconfiguration, django, flask]
match:
  kind: call
  callee: set_cookie
  callee_suffix: true
  filters:
    - not:
        kind: call
        filters:
          - kwarg:
              name: secure
              value_pattern: "^(True|1|[^FN0].*|F[^a].*|N[^o].*)$"
    - not:
        kind: call
        filters:
          - argument_literal_matches: "^$"
    - not:
        kind: call
        filters:
          - kwarg:
              name_pattern: "^(max_age|expires)$"
              value_pattern: "^(0|-[0-9]+|.*1970.*)$"
fix_suggestion: "Pass secure=True to set_cookie (and serve the site over HTTPS only)."
