id: ZS-PY-094
lifecycle: released
name: Key-Sized Value from the random Module
version: "1.0.0"
language: python
category: cryptography
severity: medium
confidence: medium
cwe:
  - CWE-338
owasp:
  - "A04:2025"
rationale: |
  random.getrandbits(n) draws from the Mersenne Twister, whose state is
  recoverable from 624 observed 32-bit outputs. Asking it for 64 or more
  bits is asking for key- or token-sized entropy (an API key, a seed, a
  reset token), which is exactly the use it cannot serve: an attacker who
  sees enough outputs predicts the next key.
description: |
  Flags random.getrandbits(N) with a literal N of 64 or more, regardless
  of the variable that receives it (ZS-PY-069 keys on that name and missed
  `key = ...getrandbits(2048)`). random.SystemRandom().getrandbits is not
  matched; it is backed by os.urandom.
message: "random.getrandbits() used for a key-sized value; use the secrets module"
references:
  - https://docs.python.org/3/library/random.html
  - https://docs.python.org/3/library/secrets.html
tags: [weak-crypto, weak-prng, random]
match:
  kind: call
  filters:
    - callee_matches: "^random\\.getrandbits$"
    - argument_literal_matches: "^([6-9][0-9]|[1-9][0-9]{2,})$"
fix_suggestion: "Use secrets.token_bytes()/secrets.token_hex()/secrets.randbits() for keys and tokens."
