id: ZS-PY-020
lifecycle: released
name: Hardcoded Credential
version: "1.0.0"
language: python
category: authentication
severity: high
confidence: medium
cwe:
  - CWE-798
owasp:
  - "A07:2025"
rationale: |
  A credential embedded directly in source code is checked into version
  control, copied into every build artifact, and visible to anyone with read
  access to the repository or a decompiled/leaked build, including former
  employees and future contributors. Once committed, rotating the secret
  requires purging repository history, and any prior clone or CI log that
  captured it remains a standing compromise.
description: |
  A variable named like a credential (password, secret, api_key, token) is
  assigned a string literal directly in source code, rather than loaded from
  an environment variable or secrets manager.
message: "Hardcoded credential detected — load secrets from environment variables or a secrets manager"
references:
  - https://cwe.mitre.org/data/definitions/798.html
tags: [hardcoded-credential, authentication]
match:
  kind: assignment
  lhs_identifier: "(?i)(password|passwd|pwd|secret|api_key|token|(^|_)pw$)"
  rhs_literal: "^[\"'].+[\"']$"
  filters:
    # A guarded sentinel is not a leaked credential: it is a known-bad value
    # that exists so a start-up check can recognise it and refuse to boot.
    # The report that motivated this flagged INSECURE_JWT_SECRET as a HIGH
    # hardcoded credential -- deleting that literal would have removed the
    # production safety check, inverting the actual security posture.
    #
    # Matched by naming convention rather than by proving the guard exists:
    # confirming the comparison would need cross-function analysis, and a
    # value shouting INSECURE_ at the reader is already a deliberate signal.
    - not:
        kind: assignment
        lhs_identifier: "(?i)^[$@_]*(INSECURE|PLACEHOLDER|CHANGEME|CHANGE_ME|DEV_ONLY|EXAMPLE|DUMMY|FAKE|SAMPLE|DEFAULT)_"
    # Value filters shared with the sibling rules ZS-PY-140/141: placeholder
    # vocabulary, and exact scheme/sentinel words that are never a secret.
    - not:
        kind: assignment
        rhs_literal: "(?i)(changeme|change_me|change-me|xxx|example|placeholder|dummy|sample|your[_-]|redacted|replace[_-]?me|<[^>]*>|\\$\\{|\\{\\{|%s|^[bru]?[\"'`]\\*+[\"'`]$)"
    - not:
        kind: assignment
        rhs_literal: "(?i)^[bru]?[\"'`](null|none|nil|undefined|true|false|empty|bearer|basic|string|text|hidden|required|password|passwd|secret|token|not-needed)[\"'`]$"
    # A name that ends in a metadata suffix describes the credential (its URL,
    # type, scheme, header) rather than holding it: TOKEN_URL, token_type,
    # repo_token_auth_scheme. A suffix test is used instead of tightening
    # rhs_literal, which would also drop literal credentials that sit inside
    # conditional expressions.
    - not:
        kind: assignment
        lhs_identifier: "(?i)(_url|_uri|_endpoint|_type|_scheme|_name|_id|_header|_prefix|_path|_field|_param)$"
fix_suggestion: "Replace the literal with os.environ['...'] or a secrets manager lookup."
