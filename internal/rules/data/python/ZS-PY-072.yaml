id: ZS-PY-072
lifecycle: released
name: Django mark_safe() on Tainted Value (XSS)
version: "1.0.0"
language: python
category: xss
severity: high
confidence: medium
cwe:
  - CWE-79
owasp:
  - "A05:2025"
rationale: |
  mark_safe() tells Django's template auto-escaper to render the string as
  raw HTML, so attacker-controlled data passing through it is written into
  the page unescaped — script tags, event handlers, and forged UI execute
  in the victim's session under the site's origin, enabling cookie theft
  and account takeover. This is exploitable wherever request data is
  wrapped in mark_safe() (or built into a SafeString) before rendering,
  which developers reach for precisely when escaping "breaks" their
  formatting.
description: |
  Detects calls to mark_safe() (django.utils.safestring) where an argument
  traces back to an untrusted source (intra-procedural taint tracking).
  The markupsafe.Markup() equivalent for Flask/Jinja is covered by
  ZS-PY-054.
message: "mark_safe() called with a tainted value — escape or sanitize before marking safe"
references:
  - https://owasp.org/www-community/attacks/xss/
tags: [xss, django, escaping]
match:
  kind: call
  callee: mark_safe
  filters:
    # Deliberately unindexed. django.utils.safestring.mark_safe(s) takes
    # exactly one parameter and it is the string being declared safe, so
    # tainted_argument_index: 0 would be a no-op. (Contrast ZS-PY-054, whose
    # Markup(base, encoding, errors) signature does have non-output
    # positions and is therefore pinned.)
    - tainted_argument: true
fix_suggestion: "Let Django's auto-escaping handle user content; if HTML is required, sanitize with bleach.clean() before marking safe."
