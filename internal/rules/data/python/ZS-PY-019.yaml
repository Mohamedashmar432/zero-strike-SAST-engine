id: ZS-PY-019
lifecycle: released
name: Django ALLOWED_HOSTS Assignment
version: "1.0.0"
language: python
category: security-misconfiguration
severity: medium
confidence: high
cwe:
  - CWE-16
owasp:
  - "A02:2025"
rationale: |
  Django uses ALLOWED_HOSTS to validate the incoming Host header; a wildcard
  ("*") or overly permissive entry disables that check, letting an attacker
  send requests with an arbitrary Host header to trigger cache poisoning,
  poison password-reset links (when the host is reflected into an email
  link), or bypass host-based routing and security controls.
description: |
  Flags an assignment to Django's ALLOWED_HOSTS whose list or tuple contains
  the wildcard '*', which disables Django's Host header validation. An
  explicit host list is not flagged.
message: "ALLOWED_HOSTS contains the wildcard '*' — Django's Host header validation is disabled"
references:
  - https://owasp.org/Top10/2025/A02_2025-Security_Misconfiguration/
tags: [misconfiguration, django, allowed-hosts]
match:
  kind: assignment
  lhs_identifier: "^ALLOWED_HOSTS$"
  # A '*' element anywhere in the list/tuple literal.
  rhs_literal: '[\[(,]\s*[''"]\*[''"]\s*[\]),]'
fix_suggestion: "List explicit hostnames in ALLOWED_HOSTS; never use '*' in production."
