id: ZS-PY-063
lifecycle: released
name: NoSQL Injection via MongoDB aggregate()
version: "1.0.0"
language: python
category: injection
severity: high
confidence: medium
cwe:
  - CWE-943
owasp:
  - "A05:2025"
rationale: |
  Aggregation pipelines accept the richest operator surface MongoDB
  exposes — $match, $where, $function, $accumulator — several of which
  evaluate JavaScript server-side, so a tainted pipeline stage built from
  request data can become arbitrary code execution inside the database
  process, in addition to the usual filter-bypass and data-extraction
  impact of NoSQL injection. This is exploitable wherever report
  parameters, search filters, or grouping keys from a request are embedded
  into the pipeline passed to aggregate().
description: |
  Detects calls to collection.aggregate() (the conventional PyMongo
  receiver name, matching ZS-PY-041's convention) where an argument traces
  back to an untrusted source (intra-procedural taint tracking).
message: "collection.aggregate() called with a tainted pipeline — validate stages and coerce user values to scalars"
references:
  - https://owasp.org/www-community/attacks/NoSQL_injection
tags: [nosql-injection, injection, mongodb]
match:
  kind: call
  callee: collection.aggregate
  filters:
    - tainted_argument: true
fix_suggestion: "Build pipeline stages from fixed templates, coerce user values to scalars, and never let request data supply $where/$function bodies."
