id: ZS-PY-016
lifecycle: released
name: Flask Debug Mode Enabled
version: "1.0.0"
language: python
category: security-misconfiguration
severity: high
confidence: medium
cwe:
  - CWE-489
owasp:
  - "A02:2025"
rationale: |
  Flask's debug mode enables the Werkzeug interactive debugger, which on an
  unhandled exception serves a browser-based console that can execute
  arbitrary Python on the server. If this debug endpoint is reachable — even
  briefly, or from an internal network an attacker has pivoted into — anyone
  who can trigger an exception gains full remote code execution.
description: |
  Detects run() called with debug=True on a plain variable receiver: app.run,
  vuln_app.run, application.run, server.run. The receiver name is not
  pinned to "app" because Flask apps are bound to any name (and connexion
  wraps one). A dotted receiver (self.app.run), a bare run(), and the
  standard-library runners (subprocess.run, asyncio.run) are not matched.
message: "run(debug=True) detected — never enable the debugger in production"
references:
  - https://owasp.org/Top10/2025/A02_2025-Security_Misconfiguration/
tags: [misconfiguration, flask, debug-mode]
match:
  kind: call
  filters:
    - callee_pattern: "^[A-Za-z_][A-Za-z0-9_]*\\.run$"
    - not:
        kind: call
        filters:
          - callee_pattern: "^(subprocess|asyncio|os|pytest|unittest|trio|anyio|loop)\\.run$"
    - kwarg:
        name: debug
        value_pattern: "^True$"
fix_suggestion: "Set debug=False (the default) and use a proper reloader setup only in local development."
