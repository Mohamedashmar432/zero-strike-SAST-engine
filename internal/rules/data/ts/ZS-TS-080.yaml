id: ZS-TS-080
lifecycle: retired
# Retired 2026-11-09 on production false-positive evidence (portal Scan Engine tags):
# https.get SSRF: 45 of 75 findings (60%) tagged false positive across 1 production project.
# Reversible: set lifecycle back to released. A retired rule's findings stop appearing; no detection
# is replaced, so a genuine instance of this pattern is no longer reported.
name: SSRF via https.get()
version: "1.0.0"
language: typescript
category: ssrf
severity: high
confidence: medium
cwe:
  - CWE-918
owasp:
  - "A01:2025"
rationale: |
  Passing an attacker-controlled URL to https.get() makes the server issue
  an HTTPS request to a destination the attacker chose — internal services
  behind the firewall, cloud metadata endpoints (169.254.169.254 hands out
  instance credentials), or third-party hosts whose responses the attacker
  can then read or use as an attack proxy. This is exploitable wherever a
  fetch/webhook URL comes from request data without scheme/host
  allowlisting.
description: |
  Detects calls to https.get() where an argument traces back to an
  untrusted source (intra-procedural taint tracking). Sibling of
  ZS-JS-038 (http.get).
  Ported verbatim from ZS-JS-082, same match shape.
message: "https.get() called with a tainted URL — validate scheme and host against an allowlist"
references:
  - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
tags: [ssrf, https, node]
match:
  kind: call
  callee: https.get
  filters:
    - tainted_argument: true
      # https.get(url|options, callback) and https.get(url, options,
      # callback): the destination is argument 0 in both shapes. Same
      # reasoning as ZS-TS-036 (http.get). Mirrors ZS-JS-082.
      tainted_argument_index: 0
      # See ZS-JS-035: a helper's URL parameter is not a source on its own.
      require_real_source: true
    # The destination is decided by scheme://host, so a URL that opens with a
    # fixed host, a same-origin path, or a configuration value
    # (process.env.X, this.baseUrl, a module constant) and only varies an id
    # or query tail is a request to a fixed service, not SSRF. A tainted
    # first operand, or a bare tainted variable, still fires.
    - argument_host_fixed: 0
fix_suggestion: "Validate the URL's host against an allowlist before requesting; never pass raw user input as the URL."
