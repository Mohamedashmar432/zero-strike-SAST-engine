id: ZS-TS-073
lifecycle: released
name: spawnSync() Command Injection
version: "1.0.0"
language: typescript
category: command-injection
severity: high
confidence: medium
cwe:
  - CWE-78
owasp:
  - "A05:2025"
rationale: |
  child_process.spawnSync() invoked with shell: true (or with a command
  line that reaches a shell) interprets its command text through /bin/sh,
  so attacker-controlled input containing shell metacharacters (;, |, &&)
  lets the attacker chain or substitute arbitrary commands with the Node
  process's privileges. Being synchronous, it also blocks the event loop,
  but the primary risk is command execution, and it is exploitable
  wherever a request value is concatenated into the spawned command.
description: |
  Detects calls to spawnSync() (child_process, commonly destructured as
  spawnSync) where an argument traces back to an untrusted source
  (intra-procedural taint tracking). Sibling of ZS-JS-029 (spawn).
  Ported verbatim from ZS-JS-075, same match shape.

  Fires only when the call can reach a shell or run an attacker-chosen
  program: the program (argument 0) is tainted, shell is enabled (shell: true
  or a shell path) with any tainted argument, or the program is a shell
  interpreter (sh, bash, cmd, powershell, ...) with a tainted later argument.
  A tainted argv element passed to a fixed, non-shell program is not command
  injection -- no shell ever parses it -- and is not reported here.
message: "spawnSync() called with a tainted argument — use an argument array without shell, and validate input"
references:
  - https://owasp.org/www-community/attacks/Command_Injection
tags: [command-injection, child-process]
match:
  kind: call
  callee: spawnSync
  filters:
    # spawn/spawnSync execute a program directly with an argv array; no shell
    # parses the arguments. Command injection (CWE-78) needs one of:
    - any_of:
        # the program itself is attacker-controlled;
        - tainted_argument: true
          tainted_argument_index: 0
        # a shell is enabled (shell: true, or a shell path string) and any
        # argument is attacker-controlled;
        - kwarg:
            name: shell
            value_pattern: "^(true|[\"'`].+[\"'`])$"
          tainted_argument: true
        # or the program is a shell interpreter and a later argv element
        # (the -c script) is attacker-controlled.
        - argument_literal_matches: "^(sh|bash|zsh|dash|ksh|/bin/(ba|z|da|k)?sh|/usr/bin/(ba|z)?sh|cmd|cmd\\.exe|powershell|powershell\\.exe|pwsh)$"
          argument_literal_index: 0
          tainted_argument: true
          tainted_argument_min_index: 1
fix_suggestion: "Pass the program and each argument as array elements with shell disabled, and allowlist any user-derived values."
