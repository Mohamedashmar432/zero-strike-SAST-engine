id: ZS-TS-123
lifecycle: released
name: "Session cookie set without secure"
version: "1.0.0"
language: typescript
category: security-misconfiguration
severity: medium
confidence: medium
cwe:
  - CWE-614
owasp:
  - "A02:2025"
rationale: |
  Express's res.cookie() defaults secure to false, so a session or token
  cookie set without the option is also sent over plain HTTP. Anyone on
  the network path (a hostile Wi-Fi hotspot, a compromised proxy) can read
  it in transit and replay it, even on a site that is normally HTTPS-only,
  because the browser still attaches it to any http:// request to the host.
description: |
  res.cookie() sets a cookie whose name looks like a credential (token,
  session, jwt, sid, auth) with no options object, or with an inline
  options object that has no secure key at all. An explicit secure: false
  is reported by ZS-JS-072 / ZS-TS-070; options passed as a variable are
  not inspected, and an empty value (clearing a cookie) is ignored.
message: "Credential cookie set without secure (Express defaults it to false) - sent over plain HTTP"
references:
  - https://cwe.mitre.org/data/definitions/614.html
  - https://expressjs.com/en/api.html#res.cookie
tags: [misconfiguration, cookie, express]
match:
  kind: call
  filters:
    - callee_pattern: "^(res|response|resp)\\.cookie$"
    - argument_matches_at:
        index: 0
        pattern: "(?i)(token|session|jwt|(^|[-_.])(sid|sess|auth)([-_.]|$)|^auth)"
    - argument_kind_not_at:
        index: 2
        kinds: [identifier, attribute, call]
    - not:
        kind: call
        filters:
          - kwarg:
              name: secure
              value_pattern: ""
    - not:
        kind: call
        filters:
          - argument_matches_at:
              index: 1
              pattern: "^$"
fix_suggestion: "Pass { secure: true, httpOnly: true, sameSite: 'lax' } (or stricter) when setting session or token cookies."
