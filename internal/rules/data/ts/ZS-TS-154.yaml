id: ZS-TS-154
lifecycle: released
name: setAttribute on* handler or tainted attribute name
version: "1.0.0"
language: typescript
category: xss
severity: high
confidence: medium
cwe:
  - CWE-79
owasp:
  - "A05:2025"
rationale: |
  setAttribute('onclick', code) turns a string into executable JavaScript, and
  a tainted attribute name lets an attacker choose any attribute, including an
  on* handler. Either way untrusted data reaches a code-execution sink. Ported
  verbatim from ZS-JS-153, same match shape.
description: |
  Detects setAttribute() where the attribute name is an on* literal and the
  value is tainted, or where the attribute name itself comes from a real
  untrusted source. A tainted value written to a harmless attribute such as
  title does not fire.
message: "setAttribute() sets an event-handler attribute from tainted data, or uses a tainted attribute name — XSS"
references:
  - https://owasp.org/www-community/attacks/xss/
  - https://developer.mozilla.org/en-US/docs/Web/API/Element/setAttribute
tags: [xss, dom-injection, setattribute]
match:
  kind: call
  callee: setAttribute
  callee_suffix: true
  filters:
    - any_of:
        - argument_literal_matches: "(?i)^on[a-z]+$"
          argument_literal_index: 0
          tainted_argument: true
          tainted_argument_index: 1
        - tainted_argument: true
          tainted_argument_index: 0
          require_real_source: true
fix_suggestion: "Bind events with addEventListener and allowlist attribute names; never pass untrusted data as handler code or attribute name."
