id: ZS-TS-005
lifecycle: released
name: Empty catch Block Swallows Exception
version: "1.0.0"
language: typescript
category: error-handling
severity: medium
confidence: high
cwe:
  - CWE-390
owasp:
  # A09 Logging & Monitoring Failures, not A10 SSRF. The old A10 mapping is
  # what rendered "Server-Side Request Forgery - FAIL, 3 findings" on a report
  # whose three findings were all swallowed exceptions and none was SSRF.
  - "A09:2025"
rationale: |
  Silently discarding an exception with no logging or handling means a
  failed security check — a broken signature verification, a failed
  authorization lookup, an exhausted validation — disappears without a
  trace, and execution continues as if it had succeeded (fail-open
  behavior); TypeScript's static typing has no bearing on this runtime
  control-flow gap. An attacker who can trigger the underlying error
  condition, for example by sending malformed input that throws during a
  validation or auth step, can rely on the empty handler to swallow the
  failure and let the request proceed as if it had passed.
description: |
  A catch block with no statements and no comment silently swallows every
  error from its try block, so a failed operation -- including a security
  control such as a signature or permission check -- is treated as success.
  Not flagged: a catch holding a comment that explains the swallow, and a
  try block whose only calls parse or convert input (JSON.parse, parseInt,
  new URL, decodeURIComponent, *.parse), where falling back on malformed
  input is the intent.
message: "Empty catch block detected — log or handle the exception instead of silently discarding it"
references:
  - https://cwe.mitre.org/data/definitions/390.html
tags: [exception-handling, empty-handler, fail-open]
match:
  kind: try
  filters:
    # An empty catch with no comment. A comment ("// ignore", "/* best
    # effort */") documents a deliberate swallow.
    - except_handler:
        empty: true
        commented: false
    # A try whose only work is parsing or converting (JSON.parse, parseInt,
    # new URL) has an obvious fallback when the input is malformed; nothing
    # security-relevant can fail open there.
    - not:
        kind: try
        filters:
          - try_body_calls_only: "^(JSON\\.parse|parseInt|parseFloat|Number|BigInt|Date|Date\\.parse|URL|URLSearchParams|decodeURIComponent|decodeURI|atob|Buffer\\.from|structuredClone|[A-Za-z_$][\\w$]*\\.parse)$"
fix_suggestion: "At minimum log the error (console.error(e)) instead of silently discarding it in the catch block."
