id: ZS-TS-156
lifecycle: released
name: href/action/formAction property assigned tainted URL
version: "1.0.0"
language: typescript
category: xss
severity: medium
confidence: medium
cwe:
  - CWE-79
owasp:
  - "A05:2025"
rationale: |
  Assigning an untrusted value to anchor.href, form.action or
  button.formAction lets an attacker supply a javascript: URI or redirect the
  user to a hostile origin. Direct location.href assignment is covered by
  ZS-TS-044 and literal javascript: assignment by ZS-TS-052, so both are
  excluded here. Ported verbatim from ZS-JS-155, same match shape.
description: |
  Detects assignments to a .href, .action or .formAction property whose
  right-hand side traces back to a real untrusted source.
message: "URL property assigned from tainted data — validate the scheme and host before assigning"
references:
  - https://owasp.org/www-community/attacks/xss/
  - https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
tags: [xss, dom-injection, href]
match:
  kind: assignment
  lhs_identifier: "\\.(href|action|formAction)$"
  filters:
    - tainted_rhs: true
      require_real_source: true
    - not:
        kind: assignment
        lhs_identifier: "(^|\\.)location\\.href$"
    - not:
        kind: assignment
        rhs_literal: "^[\"'`]\\s*javascript:"
fix_suggestion: "Parse the value with new URL() and allowlist the protocol (http/https) and host before assigning it to href/action/formAction."
