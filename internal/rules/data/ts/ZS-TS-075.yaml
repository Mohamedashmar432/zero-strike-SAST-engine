id: ZS-TS-075
lifecycle: released
name: vm.runInThisContext() with Tainted Code
version: "1.0.0"
language: typescript
category: dangerous-functions
severity: high
confidence: medium
cwe:
  - CWE-95
owasp:
  - "A05:2025"
rationale: |
  vm.runInThisContext() compiles and executes its string argument in the
  current V8 context, so attacker-controlled data reaching it is arbitrary
  code execution inside the Node process — file system, network, process
  environment all reachable. Unlike runInNewContext it shares the current
  global object, so the injected code can also read or mutate application
  state directly.
description: |
  Detects calls to vm.runInThisContext() where the code argument traces
  back to an untrusted source (intra-procedural taint tracking). Sibling
  of ZS-JS-043 (vm.runInNewContext).
  Ported verbatim from ZS-JS-077, same match shape.
message: "vm.runInThisContext() called with tainted code — never execute user input"
references:
  - https://owasp.org/www-community/attacks/Code_Injection
tags: [code-injection, vm, eval-like]
match:
  kind: call
  callee: vm.runInThisContext
  filters:
    - tainted_argument: true
fix_suggestion: "Never pass user input to vm execution; use a fixed script set or a real sandbox (isolated-vm) for untrusted code."
