id: ZS-TS-027
lifecycle: released
name: child_process.spawn() Command Injection
version: "1.0.0"
language: typescript
category: injection
severity: high
confidence: high
cwe:
  - CWE-78
owasp:
  - "A05:2025"
rationale: |
  child_process.spawn() only runs its command through a system shell when
  the caller explicitly passes { shell: true } in its options — by default
  it executes the named program directly, so shell metacharacters (;, |,
  &&, backticks) in an argument are NOT reinterpreted the way they would be
  with exec(). That said, a tainted value reaching spawn() is still
  dangerous regardless of the shell option: spawn's first argument is the
  program to execute, so if THAT is attacker-influenced the attacker picks
  which binary runs on the host, full stop — no shell needed. And whenever
  { shell: true } is present (a common way to get glob/pipe behavior),
  tainted arguments regain the full shell-metacharacter injection risk that
  exec() has. TypeScript's type system offers no protection here — a
  tainted string still type-checks identically to a trusted one — so this
  is exploitable wherever a request parameter or form field reaches
  spawn()'s command or argument list unsanitized.

  TypeScript is a fully separate language in this engine and inherits
  nothing from ZS-JS-029, so this gap is total, not partial — ported
  verbatim from ZS-JS-029, same match shape.
description: |
  Detects calls to spawn() (child_process.spawn) where any argument traces
  back to an untrusted source (intra-procedural taint tracking, including a
  source expression used directly inline as the argument — e.g.
  spawn('ping', [req.body.host]) — not only via a previously-assigned named
  variable).

  Fires only when the call can reach a shell or run an attacker-chosen
  program: the program (argument 0) is tainted, shell is enabled (shell: true
  or a shell path) with any tainted argument, or the program is a shell
  interpreter (sh, bash, cmd, powershell, ...) with a tainted later argument.
  A tainted argv element passed to a fixed, non-shell program is not command
  injection -- no shell ever parses it -- and is not reported here.
  The callee must resolve to child_process.spawn through its import or require binding (any local name, node: prefix included), or be a bare spawn() with no import binding in the file.
message: "spawn() called with a tainted argument — command injection / arbitrary program execution risk"
references:
  - https://owasp.org/www-community/attacks/Command_Injection
  - https://nodejs.org/api/child_process.html#child_processspawncommand-args-options
tags: [command-injection, injection, child-process]
match:
  kind: call
  callee: spawn
  # Any receiver ending in .spawn is a candidate (cp.spawn, child_process.spawn,
  # require('child_process').spawn); callee_canonical then requires the callee
  # to resolve to the child_process module, or to be the bare name with no
  # import binding. So new RegExp(p).exec(s), re.exec(s) and a redux-saga
  # spawn imported from another package do not match.
  callee_suffix: true
  filters:
    - callee_canonical: '^(child_process\.)?spawn$'
    # spawn/spawnSync execute a program directly with an argv array; no shell
    # parses the arguments. Command injection (CWE-78) needs one of:
    - any_of:
        # the program itself is attacker-controlled;
        - tainted_argument: true
          tainted_argument_index: 0
        # a shell is enabled (shell: true, or a shell path string) and any
        # argument is attacker-controlled;
        - kwarg:
            name: shell
            value_pattern: "^(true|[\"'`].+[\"'`])$"
          tainted_argument: true
        # or the program is a shell interpreter and a later argv element
        # (the -c script) is attacker-controlled.
        - argument_literal_matches: "^(sh|bash|zsh|dash|ksh|/bin/(ba|z|da|k)?sh|/usr/bin/(ba|z)?sh|cmd|cmd\\.exe|powershell|powershell\\.exe|pwsh)$"
          argument_literal_index: 0
          tainted_argument: true
          tainted_argument_min_index: 1
fix_suggestion: "Never build the executable name or arguments from unsanitized input; validate against an allowlist and avoid the { shell: true } option."
