id: ZS-TS-162
lifecycle: released
name: Handlebars SafeString / htmlSafe with dynamic value
version: "1.0.0"
language: typescript
category: xss
severity: medium
confidence: low
cwe:
  - CWE-79
owasp:
  - "A05:2025"
rationale: |
  Handlebars.SafeString and Ember's htmlSafe() mark a string as already-safe
  markup so the template engine skips escaping it. When the string is built
  from non-constant parts that were not escaped, it is an injection point.
  Ported verbatim from ZS-JS-161, same match shape.
description: |
  Detects SafeString(...) and htmlSafe(...) calls with a non-constant argument
  that does not reference an escaping helper (escapeExpression, escapeHTML,
  sanitize).
message: "SafeString/htmlSafe built from a dynamic value — escape the dynamic parts or sanitize the markup"
references:
  - https://handlebarsjs.com/api-reference/utilities.html#handlebars-safestring-string
  - https://owasp.org/www-community/attacks/xss/
tags: [xss, handlebars, htmlsafe]
match:
  kind: call
  filters:
    - callee_pattern: "(^|\\.)(SafeString|htmlSafe)$"
    - argument_not_constant: 0
    - not:
        kind: call
        filters:
          - argument_identifier_matches: "^(escapeExpression|escapeHTML|escapeHtml|sanitize)$"
fix_suggestion: "Pass dynamic parts through Handlebars.Utils.escapeExpression() before concatenating them, or sanitize the final markup with DOMPurify."
