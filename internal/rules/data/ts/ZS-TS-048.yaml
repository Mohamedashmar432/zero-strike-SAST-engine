id: ZS-TS-048
lifecycle: released
name: DOM Open Redirect via location.assign()
version: "1.0.0"
language: typescript
category: open-redirect
severity: medium
confidence: medium
cwe:
  - CWE-601
owasp:
  - "A01:2025"
rationale: |
  Passing attacker-controlled data to location.assign() navigates the
  browser to a URL the attacker chose — a phishing clone reached through a
  link that genuinely starts on the trusted site, or a javascript: URL
  that escalates the redirect into DOM XSS. Because the navigation happens
  client-side after the trusted page loads, link-reputation checks and
  cautious users are both bypassed.
description: |
  Detects calls to location.assign() where the destination traces back to
  an untrusted source (intra-procedural taint tracking). ZS-JS-046 covers
  location.href assignment; this rule and ZS-JS-051 cover the method-call
  navigation forms.
  Ported verbatim from ZS-JS-050, same match shape.
message: "location.assign() called with a tainted destination — validate against an allowlist of paths"
references:
  - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
tags: [open-redirect, dom, navigation]
match:
  kind: call
  callee: location.assign
  filters:
    - tainted_argument: true
fix_suggestion: "Only navigate to same-origin relative paths from an allowlist; never pass raw user input to location.assign()."
