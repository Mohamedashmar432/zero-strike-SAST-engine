id: ZS-TS-081
lifecycle: released
name: Log Injection via console.log()
version: "1.0.0"
language: typescript
category: logging
severity: medium
confidence: low
# A browser's devtools console is not a log store: nobody downstream parses
# it, so there is nothing to forge. Server code only.
skip_contexts: [browser]
cwe:
  - CWE-117
owasp:
  - "A09:2025"
rationale: |
  Writing attacker-controlled data straight to logs lets the attacker
  forge log entries: embedded newlines (CR/LF) split one entry into many,
  fabricating events that never happened or erasing the trail of an
  attack, and crafted control sequences (ANSI escapes) can corrupt log
  viewers or exploit terminal-parsing bugs in whoever reads the logs. In
  incident response, poisoned logs mean the real attack goes unseen.
description: |
  Detects calls to console.log() in server-side code where an argument traces
  back to a real untrusted source -- a request field, not merely a function
  parameter (require_real_source). ZS-JS-009 / ZS-TS-014 cover the distinct
  problem of logging credential-shaped values; this rule covers log forging
  with untrusted input.

  Not applied to browser code (inline <script> in HTML, Angular modules,
  "use client" modules, files under a frontend/ root): console output there
  is the user's own devtools, not a log another system trusts.

  Confidence is low: logging request-derived values is common and often
  benign, so findings should be triaged for whether output is structured
  and newline-escaped.
message: "console.log() called with a tainted value — escape newlines/control chars to prevent log forging"
references:
  - https://cwe.mitre.org/data/definitions/117.html
tags: [logging, log-injection, crlf]
match:
  kind: call
  callee: console.log
  filters:
    # Log forging needs input from an untrusted party. Taint that exists only
    # because every function parameter is seeded untrusted (a logger wrapper's
    # message argument, an RxJS error callback's err) is not that.
    - tainted_argument: true
      require_real_source: true
fix_suggestion: "Log structured fields (JSON.stringify of an object) or strip CR/LF and control characters from user-derived values before logging."
