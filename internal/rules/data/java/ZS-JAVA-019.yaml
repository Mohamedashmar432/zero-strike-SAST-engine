id: ZS-JAVA-019
lifecycle: released
name: Server-Side Request Forgery (java.net.URL)
version: "1.0.0"
language: java
category: ssrf
severity: high
confidence: medium
cwe:
  - CWE-918
owasp:
  - "A01:2025"
rationale: |
  Constructing a java.net.URL from a request-derived string and later opening
  it lets an attacker redirect the server's own outbound request to
  internal-only services, loopback addresses, or cloud metadata endpoints
  (e.g. 169.254.169.254) that are normally unreachable from outside the
  network, potentially exposing internal APIs, credentials, or instance
  metadata. This is exploitable in any feature that fetches a user-supplied
  URL, such as webhook registration, link previews, or file-import-by-URL.
  new URL(taintedUrl) is the clean match point because the taint lives in
  the constructor argument; matching the later chained .openConnection() call
  instead wouldn't work — it takes zero arguments, and the engine can't
  resolve that chain back to the URL constructor that produced its receiver
  — so this targets construction directly, which also catches the case where
  the URL is built but the connection is opened somewhere else entirely.
description: |
  A java.net.URL is constructed with a value that traces back to an
  untrusted source (intra-procedural taint tracking), indicating the request
  destination is attacker-influenced.
message: "new URL() called with a tainted destination — validate and allowlist the URL before connecting to it"
references:
  - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
tags: [ssrf, url, request-forgery]
match:
  kind: call
  callee: URL
  filters:
    # DELIBERATELY UNINDEXED. java.net.URL has several constructor shapes and
    # no single position describes the destination:
    #
    #   new URL(spec)                          -> spec is 0
    #   new URL(context, spec)                 -> spec is 1
    #   new URL(protocol, host, file)          -> host is 1, file is 2
    #   new URL(protocol, host, port, file)    -> host is 1, file is 3
    #
    # A negative index (-1) would cover spec and file but silently drop a
    # tainted *host*, which is the most dangerous position of all. More to
    # the point, the false-positive class this family is being narrowed for
    # does not exist here: unlike axios.post/http.Post, no argument of any
    # URL constructor is a request body or an option. Every string argument
    # is part of the destination, so "any argument tainted" is already the
    # correct predicate and indexing could only lose real detections.
    #
    # require_real_source was tried here and REVERTED — do not re-add it
    # without re-scanning WebGoat. Taint is file-scoped and intra-procedural,
    # so a controller that hands its @RequestParam to a helper leaves the
    # helper's parameter carrying only weak taint. Requiring a real source
    # therefore deleted WebGoat's own SSRF lesson
    # (SSRFTask2.furBall: @RequestParam String url -> new URL(url)) and its
    # JWT jku attack (JWTHeaderJKUEndpoint: attacker-chosen jku header ->
    # new URL(jku.asString())). The benchmark corpus stayed green through
    # both losses; only the real-target scan caught it.
    - tainted_argument: true
fix_suggestion: "Validate the URL against an allowlist. Reject internal/private IPs and non-http(s) schemes before opening a connection."
