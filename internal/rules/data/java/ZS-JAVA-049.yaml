id: ZS-JAVA-049
lifecycle: released
name: XPath Injection via XPath.compile()
version: "1.0.0"
language: java
category: injection
severity: high
confidence: medium
cwe:
  - CWE-643
owasp:
  - "A05:2025"
rationale: |
  Compiling an XPath expression with attacker-controlled text lets the
  attacker change the expression's semantics: quote termination turns a
  name lookup into arbitrary document traversal, and boolean operator
  injection (or '1'='1) turns per-record existence checks into a
  bit-by-bit extraction oracle for anything in the document - the XPath
  equivalent of SQL injection. javax.xml.xpath performs no escaping on
  compiled expressions, so concatenated request data is directly
  exploitable.
description: |
  Detects calls to xpath.compile() (the conventional javax.xml.xpath
  receiver name, matching ZS-JAVA-025's convention for xpath.evaluate)
  where an argument traces back to an untrusted source (intra-procedural
  taint tracking).
message: "xpath.compile() called with a tainted expression - use XPath variables instead of string interpolation"
references:
  - https://owasp.org/www-community/attacks/XPATH_Injection
tags: [xpath-injection, injection]
match:
  kind: call
  callee: xpath.compile
  filters:
    - tainted_argument: true
fix_suggestion: "Keep the XPath static and bind user values via XPathVariableResolver instead of concatenating them into the expression."
