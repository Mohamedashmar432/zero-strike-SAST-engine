id: ZS-JAVA-037
lifecycle: released
name: SQL Injection via Statement.execute()
version: "1.0.0"
language: java
category: injection
severity: high
confidence: medium
cwe:
  - CWE-89
owasp:
  - "A05:2025"
rationale: |
  Statement.execute() runs the SQL string it is given verbatim, so
  building that string by concatenating attacker-controlled input lets
  an attacker terminate the intended query and append arbitrary SQL -
  bypassing authentication, extracting other tables via UNION SELECT, or
  modifying and deleting data, and execute() additionally permits
  multiple result types which some drivers chain into stacked
  statements. This is exploitable wherever a request parameter reaches
  the raw query string before execute() runs it.
description: |
  Detects calls to stmt.execute() (the conventional Statement receiver
  name, matching ZS-JAVA-001/010's convention) where an argument traces
  back to an untrusted source (intra-procedural taint tracking).
message: "stmt.execute() called with a tainted query string - use PreparedStatement with bound parameters"
references:
  - https://owasp.org/www-community/attacks/SQL_Injection
tags: [sqli, injection, jdbc]
match:
  kind: call
  # Any receiver, not just a variable literally named "stmt". WebGoat
  # writes statement.execute(query); pinning the receiver name missed
  # every one. Precision comes from tainted_argument_index below.
  callee: execute
  callee_suffix: true
  filters:
    - tainted_argument: true
      # The query string only. These APIs take the SQL first and bind
      # parameters afterwards, so a tainted value in a later argument is
      # the CORRECT, parameterised form and must not be flagged.
      tainted_argument_index: 0
fix_suggestion: "Use PreparedStatement with ? placeholders and bound parameters instead of concatenating values into the query string."
