id: ZS-JAVA-038
lifecycle: released
name: printStackTrace() Information Exposure
version: "1.0.0"
language: java
category: error-handling
severity: medium
confidence: medium
cwe:
  - CWE-209
owasp:
  - "A05:2025"
rationale: |
  printStackTrace() dumps the full exception stack - class names, file
  paths, line numbers, and sometimes sensitive values embedded in
  exception messages - to standard error, which in servlet containers
  and serverless runtimes lands in response bodies or loosely-guarded
  logs. That output hands an attacker a map of the codebase (framework
  versions, package layout, query text) that materially lowers the cost
  of finding and targeting the next vulnerability.
description: |
  Detects calls to e.printStackTrace() (the conventional single-letter
  catch-block receiver). The sibling ZS-JAVA-039 covers the "ex"
  receiver convention; other receiver names are not matched.
message: "e.printStackTrace() detected - log via a proper logger and return a generic error"
references:
  - https://cwe.mitre.org/data/definitions/209.html
tags: [error-handling, information-disclosure, stack-trace]
match:
  kind: call
  callee: e.printStackTrace
fix_suggestion: "Log the exception with a structured logger (logger.error(\"op failed\", e)) and return a generic message to the caller."
