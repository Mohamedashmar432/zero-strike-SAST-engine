version: "1"
cases:
  - file: cases/aws-access-key.txt
    expect: [{rule_id: ZS-SEC-001, min_count: 1}]
  - file: cases/github-token.txt
    expect: [{rule_id: ZS-SEC-002, min_count: 1}]
  - file: cases/generic-api-key.txt
    expect: [{rule_id: ZS-SEC-003, min_count: 1}]
  - file: cases/hardcoded-password.txt
    expect: [{rule_id: ZS-SEC-004, min_count: 1}]
  - file: cases/private-key-pem.txt
    expect: [{rule_id: ZS-SEC-005, min_count: 1}]
  - file: cases/clean.txt
    expect: []
  # v0.37.0 detectors. Each has a vulnerable case and a clean case so a
  # regression in either direction (missed credential, or a placeholder /
  # runtime reference reported) fails the gate.
  - file: cases/password-comparison.txt
    expect: [{rule_id: ZS-SEC-027, min_count: 1}]
  - file: cases/password-comparison-clean.txt
    expect: []
  - file: cases/xml-credential.xml
    expect: [{rule_id: ZS-SEC-028, min_count: 1}]
  - file: cases/xml-credential-clean.xml
    expect: []
  - file: cases/rpc-url-key.txt
    expect: [{rule_id: ZS-SEC-029, min_count: 1}]
  - file: cases/rpc-url-key-clean.txt
    expect: []
  - file: cases/totp-seed.yml
    expect: [{rule_id: ZS-SEC-030, min_count: 1}]
  - file: cases/totp-seed-clean.yml
    expect: []
  - file: cases/dotenv/.env
    expect: [{rule_id: ZS-SEC-031, min_count: 2}]
  - file: cases/dotenv-example/.env.example
    expect: []
  - file: cases/compose/docker-compose.yml
    expect: [{rule_id: ZS-SEC-032, min_count: 1}]
  # A data file under a static/ directory: the walker enters asset dirs in
  # data-only mode so the secrets scanner sees committed seed data there.
  - file: cases/static/data/users.yml
    expect: [{rule_id: ZS-SEC-004, min_count: 1}]
  - file: cases/runtime-reference-clean.txt
    expect: []
